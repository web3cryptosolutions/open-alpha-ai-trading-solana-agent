name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (strict, all packages)
        run: pnpm -r typecheck

      - name: Smoke test — deterministic backtest runs
        run: pnpm agent:backtest

      - name: Smoke test — one live cycle runs
        run: pnpm agent
